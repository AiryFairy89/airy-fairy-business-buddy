n.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fffdfbf2;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;overflow-x:auto}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;min-width:57px;padding:5px 4px;border-radius:10px;display:flex;align-items:center;flex-direction:column;gap:3px}.nav button span{font-size:20px}.nav button.active{background:#f4e6e3;color:var(--rose-dark);font-weight:700}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item h3{font-size:15px;margin:0 0 3px}.item p{margin:3px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.pill{display:inline-block;background:#f4e7e3;color:var(--rose-dark);font-size:11px;padding:3px 8px;border-radius:99px;margin:3px 4px 0 0}.pill.done{background:#e5eee8;color:#426a55}.pill.enquiry{background:#fbf0d8;color:#8c6925}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddcbc7;border-radius:10px;background:white;color:var(--ink);font:inherit}textarea{min-height:70px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.formgrid .wide{grid-column:1/-1}.hidden{display:none!important}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}.dayname{text-align:center;font-size:10px;color:var(--muted);padding:5px 0}.day{min-height:65px;background:white;border:1px solid var(--line);border-radius:8px;padding:5px 3px;font-size:12px;overflow:hidden}.day.today{border:2px solid var(--rose)}.day .dot{display:block;font-size:9px;background:#f0dfe0;color:#784d57;border-radius:4px;padding:2px;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.day .dot.seasonal{background:#eee4d0;color:#786037}.day.empty{background:transparent;border-color:transparent}.empty{text-align:center;padding:24px 8px;color:var(--muted)}.todo-row{display:flex;align-items:flex-start;gap:10px}.todo-row input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--rose)}.todo-text{flex:1}.todo-text.done{text-decoration:line-through;color:#a29292}.divider{height:1px;background:var(--line);margin:13px 0}.notice{background:#f3e7df;border-radius:12px;padding:12px;font-size:13px;color:#765a5d}.foot{text-align:center;color:var(--muted);font-size:11px;padding:14px}.month-label{font:17px Georgia,serif}.modal{position:fixed;inset:0;background:#30232677;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modalbox{background:var(--cream);border-radius:20px 20px 0 0;width:100%;max-width:700px;max-height:92dvh;overflow:auto;padding:20px 17px calc(20px + env(safe-area-inset-bottom))}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font:22px Georgia,serif;margin:0}.close{border:0;background:#f0e1de;border-radius:50%;width:34px;height:34px;font-size:20px;color:var(--rose-dark)}@media(min-width:700px){.wrap{padding:24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{left:50%;right:auto;transform:translateX(-50%);width:min(720px,100%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}.modal{align-items:center}.modalbox{border-radius:20px}}@media print{header,.nav,.no-print,.actions,.btn{display:none!important}body{background:white;padding:0}.wrap{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid}.item{break-inside:avoid}.section-title{margin-top:8px}}
